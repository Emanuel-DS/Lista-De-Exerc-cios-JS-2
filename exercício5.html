<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX 5 JS</title>
</head>
<body>

    <script>

        let n1 = parseInt(prompt("Digite um número: "));

        if(n1 == 2 || n1 == 3 || n1 == 5){
            alert("Esse número é primo");
        } else if(n1 % 2 == 0 || n1 % 3 == 0 || n1 % 5 == 0){
            alert("Esse número não é primo");
        }

    </script>
    
</body>
</html>
