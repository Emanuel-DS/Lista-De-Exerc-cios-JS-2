<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX 3 JS</title>
</head>

    <script>

     let num = parseInt(prompt("Digite um número - ou +"));

        if(num <0 ){
            alert("Estes número é negativo!");
        } else if(num >0){
            alert("Este número é positivo!");
        } else {
            alert("Número 0 é neutro!")
        }


    </script>

</body>
</html>
