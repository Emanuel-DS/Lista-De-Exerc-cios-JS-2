<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 2 JS</title>
</head>
<body>
    <script>

        let n1 = parseInt(prompt("Digite o primeiro valor: "));
        let n2 = parseInt(prompt("Digite o segundo valor: "));
        let n3 = parseInt(prompt("Digite o terceiro valor: "));

        if(n1 >n2 && n1 >n3){
            alert("O primeiro valor é o maior!");
        } else if(n2 > n1 && n2 > n3){
            alert("O segundo valor é o maior!");
        } else{
            alert("O terceiro valor é o maior!");
        }

    </script>
    
</body>
